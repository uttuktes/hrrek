<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Evaluasi Kinerja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-4xl mx-auto bg-white p-6 shadow-lg rounded-lg">
    <h1 class="text-2xl font-bold mb-4 text-center">Form Evaluasi Kinerja</h1>

    <!-- Form POST langsung ke Apps Script dengan iframe -->
    <form action="https://script.google.com/macros/s/AKfycbzOqgNBBul7p_GBbVtxzXTQ8m-gkM74ES8xSb5ODSpI17LEKphEPxZseGnqbnALsQAc/exec"
          method="POST"
          target="hidden_iframe"
          onsubmit="setTimeout(() => { alert('Data berhasil dikirim!'); this.reset(); }, 500);">

      <!-- Periode -->
      <label for="periode" class="block mt-2 font-semibold">Periode:</label>
      <select id="periode" name="periode" required class="border rounded w-full p-2">
        <option value="">Pilih Periode</option>
        <option>Jan - Apr</option>
        <option>Mei - Agu</option>
        <option>Sep - Des</option>
      </select>

      <!-- Departemen -->
      <label for="department" class="block mt-2 font-semibold">Departemen:</label>
      <select id="department" name="department" required class="border rounded w-full p-2"></select>

      <!-- Manager -->
      <label for="manager" class="block mt-2 font-semibold">Atasan:</label>
      <select id="manager" name="manager" required class="border rounded w-full p-2" disabled>
        <option value="">Pilih Atasan</option>
      </select>

      <!-- Karyawan -->
      <label for="employee" class="block mt-2 font-semibold">Karyawan:</label>
      <select id="employee" name="employee" required class="border rounded w-full p-2" disabled>
        <option value="">Pilih Karyawan</option>
      </select>

      <!-- Pertanyaan Q1 - Q8 -->
      <div class="mt-4 space-y-3">
        <label class="block font-semibold">1. Disiplin dalam melakukan pekerjaan sesuai instruksi</label>
        <input type="number" min="1" max="5" name="q1" required class="border rounded w-full p-2">

        <label class="block font-semibold">2. Trampil dalam mengerjakan tugas</label>
        <input type="number" min="1" max="5" name="q2" required class="border rounded w-full p-2">

        <label class="block font-semibold">3. Sigap dalam menjalankan pekerjaan</label>
        <input type="number" min="1" max="5" name="q3" required class="border rounded w-full p-2">

        <label class="block font-semibold">4. Tidak membuang waktu di luar pekerjaan</label>
        <input type="number" min="1" max="5" name="q4" required class="border rounded w-full p-2">

        <label class="block font-semibold">5. Mampu bekerjasama dengan rekan</label>
        <input type="number" min="1" max="5" name="q5" required class="border rounded w-full p-2">

        <label class="block font-semibold">6. Siap melaksanakan perintah atasan</label>
        <input type="number" min="1" max="5" name="q6" required class="border rounded w-full p-2">

        <label class="block font-semibold">7. Menjaga kebersihan lingkungan kerja</label>
        <input type="number" min="1" max="5" name="q7" required class="border rounded w-full p-2">

        <label class="block font-semibold">8. Memahami bahwa bekerja adalah ibadah</label>
        <input type="number" min="1" max="5" name="q8" required class="border rounded w-full p-2">
      </div>

      <!-- Notes -->
      <label for="notes" class="block mt-4 font-semibold">Catatan:</label>
      <textarea id="notes" name="notes" rows="4" class="border rounded w-full p-2"></textarea>

      <!-- Submit -->
      <div class="flex justify-end mt-6">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">Submit</button>
      </div>
    </form>

    <!-- Hidden iframe supaya tidak reload -->
    <iframe name="hidden_iframe" style="display:none;"></iframe>
  </div>

  <script>
    // Script untuk load data Departemen, Manager, Karyawan via JSONP
    const API_URL = "https://script.google.com/macros/s/AKfycbzOqgNBBul7p_GBbVtxzXTQ8m-gkM74ES8xSb5ODSpI17LEKphEPxZseGnqbnALsQAc/exec";

    let formData = {};

    function loadData(data) {
      formData = data;
      const deptSelect = document.getElementById("department");
      deptSelect.innerHTML = "<option value=''>Pilih Departemen</option>";

      Object.keys(data).forEach(dept => {
        const opt = document.createElement("option");
        opt.value = dept;
        opt.textContent = dept;
        deptSelect.appendChild(opt);
      });

      deptSelect.addEventListener("change", () => {
        const mgrSelect = document.getElementById("manager");
        const empSelect = document.getElementById("employee");
        mgrSelect.innerHTML = "<option value=''>Pilih Atasan</option>";
        empSelect.innerHTML = "<option value=''>Pilih Karyawan</option>";
        mgrSelect.disabled = true;
        empSelect.disabled = true;

        if (data[deptSelect.value]) {
          Object.keys(data[deptSelect.value]).forEach(mgr => {
            const opt = document.createElement("option");
            opt.value = mgr;
            opt.textContent = mgr;
            mgrSelect.appendChild(opt);
          });
          mgrSelect.disabled = false;
        }
      });

      document.getElementById("manager").addEventListener("change", () => {
        const dept = document.getElementById("department").value;
        const mgr = document.getElementById("manager").value;
        const empSelect = document.getElementById("employee");
        empSelect.innerHTML = "<option value=''>Pilih Karyawan</option>";
        empSelect.disabled = true;

        if (dept && mgr && data[dept][mgr]) {
          data[dept][mgr].forEach(emp => {
            const opt = document.createElement("option");
            opt.value = emp;
            opt.textContent = emp;
            empSelect.appendChild(opt);
          });
          empSelect.disabled = false;
        }
      });
    }

    const script = document.createElement("script");
    script.src = `${API_URL}?callback=loadData`;
    document.body.appendChild(script);
  </script>
</body>
</html>
