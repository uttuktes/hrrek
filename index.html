<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Evaluasi Kinerja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f4f6; }
    .animated-dropdown {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      transition: all 0.15s ease;
    }
    .oval-container { display: flex; justify-content: center; gap: .5rem; }
    .circle-option input[type="radio"] { display: none; }
    .circle-option {
      width: 2rem; height: 2rem;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #6b7280; border-radius: 9999px;
      cursor: pointer; font-size: .875rem; background: #fff;
    }
    .circle-option input[type="radio"]:checked + span {
      background: #2563eb; color: white; border-radius: 9999px; padding: .25rem .5rem;
    }
    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #2563eb;
      border-radius: 50%;
      width: 16px; height: 16px;
      animation: spin 1s linear infinite;
      display: inline-block; margin-left: 6px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto bg-white p-6 shadow rounded-lg mt-4">
    <img src="https://media.licdn.com/dms/image/v2/D4E3DAQHdQ8hI0F8kFw/image-scale_191_1128/image-scale_191_1128/0/1729146506484/espera_satya_cover?e=2147483647&v=beta&t=Li35iFgVbilg53Our-rLWfp4cdXEVmF1ZzX6mRVCLfw"
         alt="Espera Satya"
         class="w-full h-36 object-cover object-right rounded-t-lg">

    <h2 class="text-2xl font-bold my-4 text-center">FORMULIR EVALUASI KINERJA</h2>

    <form id="evaluationForm" class="space-y-6">
      <!-- Periode -->
      <div>
        <label class="block font-semibold">Masa Penilaian</label>
        <select name="periode" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm" required>
          <option value="">Pilih Periode</option>
          <option>Jan - Apr</option>
          <option>Mei - Agu</option>
          <option>Sep - Des</option>
        </select>
      </div>

      <!-- Departemen -->
      <div>
        <label class="block font-semibold">Departemen</label>
        <select id="department" name="department" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm" required>
          <option value="">Pilih Departemen</option>
        </select>
      </div>

      <!-- Atasan -->
      <div>
        <label class="block font-semibold">Atasan</label>
        <select id="manager" name="manager" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm" required disabled>
          <option value="">Pilih Atasan</option>
        </select>
      </div>

      <!-- Karyawan -->
      <div>
        <label class="block font-semibold">Karyawan</label>
        <select id="employee" name="employee" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm" required disabled>
          <option value="">Pilih Karyawan</option>
        </select>
      </div>

      <!-- Pertanyaan (1–8) -->
      <div>
        <p class="font-semibold mb-2 underline">Penilaian Karyawan :</p>
        <div class="space-y-4 mt-4">

          <div>
            <label class="block mb-1">1. Disiplin dalam melakukan pekerjaan sesuai instruksi kerja yang ada</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q1" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q1" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q1" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q1" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q1" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">2. Terampil dalam mengerjakan tugas</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q2" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q2" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q2" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q2" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q2" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">3. Sigap dalam menjalankan pekerjaan</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q3" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q3" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q3" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q3" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q3" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">4. Tidak banyak mengobrol dalam jam kerja / membuang waktu</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q4" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q4" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q4" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q4" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q4" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">5. Siap dan mampu bekerjasama dengan rekan kerja</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q5" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q5" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q5" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q5" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q5" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">6. Siap melaksanakan perintah atasan (misal: lembur)</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q6" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q6" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q6" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q6" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q6" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">7. Menjaga kebersihan mesin dan lingkungan kerja</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q7" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q7" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q7" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q7" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q7" value="5"><span>5</span></label>
            </div>
          </div>

          <div>
            <label class="block mb-1">8. Memahami bahwa bekerja adalah ibadah</label>
            <div class="oval-container">
              <label class="circle-option"><input type="radio" name="q8" value="1" required><span>1</span></label>
              <label class="circle-option"><input type="radio" name="q8" value="2"><span>2</span></label>
              <label class="circle-option"><input type="radio" name="q8" value="3"><span>3</span></label>
              <label class="circle-option"><input type="radio" name="q8" value="4"><span>4</span></label>
              <label class="circle-option"><input type="radio" name="q8" value="5"><span>5</span></label>
            </div>
          </div>

        </div>
      </div>

      <!-- Evaluasi Karyawan -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1 underline">Evaluasi Karyawan :</label>
        <textarea id="notes" name="notes" rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" placeholder="Hal-hal yang perlu diperbaiki terkait tampilan kinerja karyawan . . ."></textarea>
      </div>

      <div class="flex justify-end">
        <button id="submitBtn" type="submit" class="bg-blue-600 text-white px-6 py-2 rounded flex items-center">
          Submit
        </button>
      </div>
    </form>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxxbd9MJUJ4ScSCUoI-H0hMxugFeBgWLe7S9tL7Jgzj_DspVilMbiLSS6F0jkxLjkDr/exec";
    let formData = {};

    function loadData(data) {
      formData = data;
      const deptSel = document.getElementById("department");
      deptSel.innerHTML = "<option value=''>Pilih Departemen</option>";
      Object.keys(data).forEach(d => {
        deptSel.innerHTML += `<option value="${d}">${d}</option>`;
      });
    }

    function getDataJSONP() {
      const script = document.createElement("script");
      script.src = API_URL + "?callback=loadData";
      document.body.appendChild(script);
    }

    document.getElementById("department").addEventListener("change", function() {
      const val = this.value;
      const mgrSel = document.getElementById("manager");
      const empSel = document.getElementById("employee");
      mgrSel.innerHTML = "<option value=''>Pilih Atasan</option>";
      empSel.innerHTML = "<option value=''>Pilih Karyawan</option>";
      mgrSel.disabled = true; empSel.disabled = true;

      if (val && formData[val]) {
        Object.keys(formData[val]).forEach(m => {
          mgrSel.innerHTML += `<option value="${m}">${m}</option>`;
        });
        mgrSel.disabled = false;
      }
    });

    document.getElementById("manager").addEventListener("change", function() {
      const dept = document.getElementById("department").value;
      const mgr = this.value;
      const empSel = document.getElementById("employee");
      empSel.innerHTML = "<option value=''>Pilih Karyawan</option>";
      empSel.disabled = true;

      if (dept && mgr && formData[dept][mgr]) {
        formData[dept][mgr].forEach(e => {
          empSel.innerHTML += `<option value="${e}">${e}</option>`;
        });
        empSel.disabled = false;
      }
    });

    document.getElementById("evaluationForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const form = e.target;
      const payload = {
        periode: form.periode.value,
        department: form.department.value,
        manager: form.manager.value,
        employee: form.employee.value,
        q1: form.q1.value, q2: form.q2.value, q3: form.q3.value, q4: form.q4.value,
        q5: form.q5.value, q6: form.q6.value, q7: form.q7.value, q8: form.q8.value,
        notes: form.notes.value
      };

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = 'Loading <span class="spinner"></span>';

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: { "Content-Type": "application/json" }
        });
        alert("Data berhasil dikirim!");
        form.reset();
      } catch (err) {
        alert("Gagal kirim: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Submit";
      }
    });

    window.onload = getDataJSONP;
  </script>
</body>
</html>
