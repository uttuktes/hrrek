<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Evaluasi Kinerja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-4xl mx-auto bg-white p-8 shadow-lg rounded-lg mt-10">
    <img src="https://media.licdn.com/dms/image/v2/D4E3DAQHdQ8hI0F8kFw/image-scale_191_1128/image-scale_191_1128/0/1729146506484/espera_satya_cover?e=2147483647&v=beta&t=Li35iFgVbilg53Our-rLWfp4cdXEVmF1ZzX6mRVCLfw"
       alt="Espera Satya"
       class="w-full h-32 object-cover rounded-t-lg">     
    <h2 class="text-2xl font-bold mb-6 text-center">FORMULIR EVALUASI KINERJA</h2>

    <form id="evaluationForm" class="space-y-6">
      <!-- Periode -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Masa Penilaian</label>
        <select name="periode" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-blue-600" required>
          <option value="">Pilih Periode</option>
          <option>Jan - Apr</option>
          <option>Mei - Agu</option>
          <option>Sep - Des</option>
        </select>
      </div>

      <!-- Departemen -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Departemen</label>
        <select id="department" name="department" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-blue-600" required>
          <option value="">Pilih Departemen</option>
        </select>
      </div>

      <!-- Atasan -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Atasan</label>
        <select id="manager" name="manager" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-blue-600" required disabled>
          <option value="">Pilih Atasan</option>
        </select>
      </div>

      <!-- Karyawan -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Karyawan</label>
        <select id="employee" name="employee" class="animated-dropdown mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-blue-600" required disabled>
          <option value="">Pilih Karyawan</option>
        </select>
      </div>

      <!-- Pertanyaan -->
      <div>
        <p class="font-semibold mb-2">Penilaian (1 = sangat kurang, 5 = sangat baik)</p>

        <!-- Loop pertanyaan -->
        <div class="space-y-3">
          <div>
            <label>1. Disiplin dalam pekerjaan</label><br>
            <input type="radio" name="q1" value="1" required>1
            <input type="radio" name="q1" value="2">2
            <input type="radio" name="q1" value="3">3
            <input type="radio" name="q1" value="4">4
            <input type="radio" name="q1" value="5">5
          </div>

          <div>
            <label>2. Trampil mengerjakan tugas</label><br>
            <input type="radio" name="q2" value="1" required>1
            <input type="radio" name="q2" value="2">2
            <input type="radio" name="q2" value="3">3
            <input type="radio" name="q2" value="4">4
            <input type="radio" name="q2" value="5">5
          </div>

          <div>
            <label>3. Sigap dalam pekerjaan</label><br>
            <input type="radio" name="q3" value="1" required>1
            <input type="radio" name="q3" value="2">2
            <input type="radio" name="q3" value="3">3
            <input type="radio" name="q3" value="4">4
            <input type="radio" name="q3" value="5">5
          </div>

          <div>
            <label>4. Tanggung jawab terhadap pekerjaan</label><br>
            <input type="radio" name="q4" value="1" required>1
            <input type="radio" name="q4" value="2">2
            <input type="radio" name="q4" value="3">3
            <input type="radio" name="q4" value="4">4
            <input type="radio" name="q4" value="5">5
          </div>

          <div>
            <label>5. Kerjasama dengan rekan kerja</label><br>
            <input type="radio" name="q5" value="1" required>1
            <input type="radio" name="q5" value="2">2
            <input type="radio" name="q5" value="3">3
            <input type="radio" name="q5" value="4">4
            <input type="radio" name="q5" value="5">5
          </div>

          <div>
            <label>6. Inisiatif dalam pekerjaan</label><br>
            <input type="radio" name="q6" value="1" required>1
            <input type="radio" name="q6" value="2">2
            <input type="radio" name="q6" value="3">3
            <input type="radio" name="q6" value="4">4
            <input type="radio" name="q6" value="5">5
          </div>

          <div>
            <label>7. Kreativitas</label><br>
            <input type="radio" name="q7" value="1" required>1
            <input type="radio" name="q7" value="2">2
            <input type="radio" name="q7" value="3">3
            <input type="radio" name="q7" value="4">4
            <input type="radio" name="q7" value="5">5
          </div>

          <div>
            <label>8. Komunikasi</label><br>
            <input type="radio" name="q8" value="1" required>1
            <input type="radio" name="q8" value="2">2
            <input type="radio" name="q8" value="3">3
            <input type="radio" name="q8" value="4">4
            <input type="radio" name="q8" value="5">5
          </div>

          <!-- Textarea Evaluasi Karyawan -->
          <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Evaluasi Karyawan</label>
              <textarea id="notes" name="notes" rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-blue-600" placeholder="Hal-hal yang perlu diperbaiki terkait tampilan kinerja karyawan..."></textarea>
         </div>
      </div>
    </div>

      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">
        Submit
      </button>
    </form>
  </div>

  <script>
    // Ganti dengan URL WebApp Apps Script kamu (deploy latest version)
    const API_URL = "https://script.google.com/macros/s/AKfycbxgG52UJOwz2kznPFT-t3AwMK-N5Hg53-nhdpYFHxDi3Z6AI3KiIXjdVq2XRizoI0tc/exec";

    let formData = {};

    // === Load data dropdown (JSONP) ===
    function loadData(data) {
      formData = data;
      const deptSel = document.getElementById("department");
      deptSel.innerHTML = "<option value=''>Pilih Departemen</option>";

      Object.keys(data).forEach(d => {
        deptSel.innerHTML += `<option value="${d}">${d}</option>`;
      });
    }

    function getDataJSONP() {
      const script = document.createElement("script");
      script.src = API_URL + "?callback=loadData";
      document.body.appendChild(script);
    }

    // === Dropdown event ===
    document.getElementById("department").addEventListener("change", function() {
      const val = this.value;
      const mgrSel = document.getElementById("manager");
      const empSel = document.getElementById("employee");
      mgrSel.innerHTML = "<option value=''>Pilih Atasan</option>";
      empSel.innerHTML = "<option value=''>Pilih Karyawan</option>";
      mgrSel.disabled = true;
      empSel.disabled = true;

      if (val && formData[val]) {
        Object.keys(formData[val]).forEach(m => {
          mgrSel.innerHTML += `<option value="${m}">${m}</option>`;
        });
        mgrSel.disabled = false;
      }
    });

    document.getElementById("manager").addEventListener("change", function() {
      const dept = document.getElementById("department").value;
      const mgr = this.value;
      const empSel = document.getElementById("employee");
      empSel.innerHTML = "<option value=''>Pilih Karyawan</option>";
      empSel.disabled = true;

      if (dept && mgr && formData[dept][mgr]) {
        formData[dept][mgr].forEach(e => {
          empSel.innerHTML += `<option value="${e}">${e}</option>`;
        });
        empSel.disabled = false;
      }
    });

    // === Submit form ===
    document.getElementById("evaluationForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const form = e.target;
      const payload = {
        periode: form.periode.value,
        department: form.department.value,
        manager: form.manager.value,
        employee: form.employee.value,
        q1: form.q1.value,
        q2: form.q2.value,
        q3: form.q3.value,
        q4: form.q4.value,
        q5: form.q5.value,
        q6: form.q6.value,
        q7: form.q7.value,
        q8: form.q8.value,
        notes: form.notes.value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: { "Content-Type": "application/json" },
          mode: "no-cors"
        });

        alert("Data berhasil dikirim!");
        form.reset();
      } catch (err) {
        alert("Gagal kirim: " + err.message);
      }
    });

    window.onload = getDataJSONP;
  </script>
</body>
</html>
