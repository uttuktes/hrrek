<script>
const API_URL = "https://script.google.com/macros/s/AKfycby8zlhbnzmbdouxJKHHWXDJLpG-265PKlQEc9exl4OGKQBesLO_bqPnGz_ocE70J504/exec";
let formData = {};

// callback dari JSONP
function loadData(data) {
  formData = data;
  const deptSel = document.getElementById("department");
  deptSel.innerHTML = "<option value=''>Pilih Departemen</option>";

  Object.keys(data).sort().forEach(d => {
    deptSel.innerHTML += `<option value="${d}">${d}</option>`;
  });

  deptSel.addEventListener("change", () => {
    const manSel = document.getElementById("manager");
    const empSel = document.getElementById("employee");
    manSel.innerHTML = `<option value="">Pilih Atasan</option>`;
    empSel.innerHTML = `<option value="">Pilih Karyawan</option>`;
    empSel.disabled = true;

    if (deptSel.value) {
      Object.keys(data[deptSel.value]).forEach(m => {
        manSel.innerHTML += `<option value="${m}">${m}</option>`;
      });
      manSel.disabled = false;
    }
  });

  document.getElementById("manager").addEventListener("change", e => {
    const dept = deptSel.value;
    const man = e.target.value;
    const empSel = document.getElementById("employee");
    empSel.innerHTML = `<option value="">Pilih Karyawan</option>`;
    if (man) {
      data[dept][man].forEach(emp => {
        empSel.innerHTML += `<option value="${emp}">${emp}</option>`;
      });
      empSel.disabled = false;
    }
  });
}

// load JSONP
function getDataJSONP() {
  const script = document.createElement("script");
  script.src = API_URL + "?callback=loadData";
  document.body.appendChild(script);
}
window.onload = getDataJSONP;
</script>
