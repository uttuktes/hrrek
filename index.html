<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>FORMULIR EVALUASI KINERJA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow">
    <h2 class="text-xl font-bold text-center mb-6">FORMULIR EVALUASI KINERJA</h2>

    <form id="evaluationForm" class="space-y-4">
      <div>
        <label class="block font-semibold">Masa Penilaian</label>
        <select id="periode" name="periode" class="border rounded w-full p-2">
          <option value="Jan - Apr">Jan - Apr</option>
          <option value="Mei - Agu">Mei - Agu</option>
          <option value="Sep - Des">Sep - Des</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold">Departemen</label>
        <select id="department" name="department" class="border rounded w-full p-2">
          <option value="">Pilih Departemen</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold">Atasan</label>
        <select id="manager" name="manager" class="border rounded w-full p-2" disabled>
          <option value="">Pilih Atasan</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold">Karyawan</label>
        <select id="employee" name="employee" class="border rounded w-full p-2" disabled>
          <option value="">Pilih Karyawan</option>
        </select>
      </div>

      <div>
        <p class="font-bold">Penilaian :</p>
        <div class="space-y-2">
          <label>1. Disiplin dalam pekerjaan</label><br>
          <input type="radio" name="q1" value="1">1
          <input type="radio" name="q1" value="2">2
          <input type="radio" name="q1" value="3">3
          <input type="radio" name="q1" value="4">4
          <input type="radio" name="q1" value="5">5
        </div>
        <div class="space-y-2">
          <label>2. Trampil mengerjakan tugas</label><br>
          <input type="radio" name="q2" value="1">1
          <input type="radio" name="q2" value="2">2
          <input type="radio" name="q2" value="3">3
          <input type="radio" name="q2" value="4">4
          <input type="radio" name="q2" value="5">5
        </div>
        <div class="space-y-2">
          <label>3. Sigap dalam pekerjaan</label><br>
          <input type="radio" name="q3" value="1">1
          <input type="radio" name="q3" value="2">2
          <input type="radio" name="q3" value="3">3
          <input type="radio" name="q3" value="4">4
          <input type="radio" name="q3" value="5">5
        </div>
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Kirim</button>
    </form>
  </div>

  <script>
    // Ganti URL ini dengan URL deploy Apps Script kamu
    const API_URL = "https://script.google.com/macros/s/AKfycby8zlhbnzmbdouxJKHHWXDJLpG-265PKlQEc9exl4OGKQBesLO_bqPnGz_ocE70J504/exec";
    let formData = {};

    // callback dari JSONP
    function loadData(data) {
      formData = data;
      console.log("Data dari Apps Script:", data);

      const deptSel = document.getElementById("department");
      deptSel.innerHTML = "<option value=''>Pilih Departemen</option>";

      Object.keys(data).forEach(d => {
        deptSel.innerHTML += `<option value="${d}">${d}</option>`;
      });

      // event saat departemen dipilih
      deptSel.onchange = function() {
        const managers = formData[this.value] || {};
        const managerSel = document.getElementById("manager");
        managerSel.disabled = false;
        managerSel.innerHTML = "<option value=''>Pilih Atasan</option>";

        Object.keys(managers).forEach(m => {
          managerSel.innerHTML += `<option value="${m}">${m}</option>`;
        });

        document.getElementById("employee").innerHTML =
          "<option value=''>Pilih Karyawan</option>";
        document.getElementById("employee").disabled = true;
      };

      // event saat atasan dipilih
      document.getElementById("manager").onchange = function() {
        const dept = document.getElementById("department").value;
        const employees = formData[dept][this.value] || [];
        const empSel = document.getElementById("employee");
        empSel.disabled = false;
        empSel.innerHTML = "<option value=''>Pilih Karyawan</option>";

        employees.forEach(e => {
          empSel.innerHTML += `<option value="${e}">${e}</option>`;
        });
      };
    }

    // ambil data JSONP
    function getDataJSONP() {
      const script = document.createElement("script");
      script.src = API_URL + "?callback=loadData";
      document.body.appendChild(script);
    }

    window.onload = getDataJSONP;

    // handle submit form
    document.getElementById("evaluationForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      alert("Form terkirim (dummy). Untuk benar-benar kirim ke Apps Script, perlu dibuat doPost handler di GS.");
    });
  </script>
</body>
</html>
